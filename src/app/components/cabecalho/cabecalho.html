<header class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <!-- Título / Logo da Loja -->
    <a class="navbar-brand fw-bold fs-4" href="#">Minha Loja</a>

    <!-- Botão de menu (Hamburguer) para dispositivos móveis -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuNavegacao"
      aria-controls="menuNavegacao"
      aria-expanded="false"
      aria-label="Alternar navegação"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <nav class="collapse navbar-collapse" id="menuNavegacao">
      <!-- Links -->
      <div class="navbar-nav me-auto mb-2 mb-lg-0">
        <a class="nav-link active" aria-current="page" routerLink="/
          ">Início</a>
        <a class="nav-link" routerLink="checkout">Checkout</a>
      </div>

      <div class="d-flex align-items-center">
        <!-- @if (quantidade() > 0) { -->
          <button (click)="esvaziarCarrinho()" class="btn btn-sm btn-danger ms-2 m-2">Esvaziar Carrinho</button>
          <span class="badge rounded-pill text-bg-primary px-3 py-2 fs-6">
            Carrinho: {{ quantidade() }}
          </span>
        <!-- } -->
      </div>
    </nav>
  </div>
</header>
